<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Digital Archive</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@300;400&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #0d0d0d;
      color: #eaeaea;
      position: relative;
      overflow-x: hidden;
    }

    /* subtle grain */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: url("https://www.transparenttextures.com/patterns/asfalt-dark.png");
      opacity: 0.06;
      pointer-events: none;
      z-index: 0;
    }

    /* slim header */
    header {
      padding: 28px 40px;
      border-bottom: 1px solid #1a1a1a;
      position: relative;
      z-index: 1;
    }

    header h1 {
      margin: 0;
      font-family: 'Playfair Display', serif;
      font-size: 26px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* hero section */
    .hero {
      padding: 120px 20px 80px;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .hero h2 {
      font-family: 'Playfair Display', serif;
      font-size: 42px;
      margin: 0 0 20px;
      font-weight: 500;
    }

    .hero p {
      margin: 0;
      font-weight: 300;
      color: #aaa;
      font-size: 18px;
      letter-spacing: 0.3px;
    }

    /* content section */
    .content {
      padding: 80px 40px 120px;
      max-width: 1100px;
      margin: auto;
      position: relative;
      z-index: 1;
    }

    /* grid layout */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 40px;
    }

    .card {
      background: rgba(20, 20, 20, 0.8);
      padding: 50px 40px;
      border-radius: 10px;
      border: 1px solid #1f1f1f;
      transition: 0.3s ease;
      backdrop-filter: blur(4px);
      text-align: center;
    }

    .card:hover {
      transform: translateY(-6px);
      border-color: #333;
    }

    .card h3 {
      font-family: 'Playfair Display', serif;
      margin: 0 0 15px;
      font-weight: 500;
      font-size: 22px;
    }

    .card p {
      margin: 0;
      color: #888;
      font-weight: 300;
      font-size: 15px;
    }

    footer {
      padding: 60px 40px;
      border-top: 1px solid #1a1a1a;
      font-size: 14px;
      color: #666;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    /* responsive tweak */
    @media (max-width: 768px) {
      .hero {
        padding: 100px 20px 60px;
      }

      .hero h2 {
        font-size: 34px;
      }

      .content {
        padding: 60px 20px 100px;
      }
    }

  </style>
</head>
<body>

<header>
  <h1>Digital Archive</h1>
</header>

<section class="hero">
  <h2>Thought Archive</h2>
  <p>Exploring Science, Philosophy & Technology</p>
</section>

<section class="content">
  <div class="grid">

    <div class="card">
      <h3>Essay 01</h3>
      <p>Coming soon...</p>
    </div>

    <div class="card">
      <h3>Essay 02</h3>
      <p>Coming soon...</p>
    </div>

    <div class="card">
      <h3>Essay 03</h3>
      <p>Coming soon...</p>
    </div>

  </div>
</section>

<footer>
  © 2025 Digital Archive
</footer>

</body>
</html>
