<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Digital Archive</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0e0e0e;
      color: #eaeaea;
      text-align: center;
    }

    header {
      padding: 60px 20px 40px;
      border-bottom: 1px solid #222;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 500;
      letter-spacing: 1px;
    }

    main {
      padding: 100px 20px;
      max-width: 800px;
      margin: auto;
    }

    h2 {
      font-size: 34px;
      margin-bottom: 20px;
      font-weight: 500;
    }

    p {
      color: #aaa;
      margin-bottom: 60px;
    }

    .card {
      background: #151515;
      padding: 40px;
      margin-bottom: 40px;
      border-radius: 8px;
      border: 1px solid #222;
      transition: 0.3s ease;
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: #444;
    }

    .card h3 {
      margin-top: 0;
      font-weight: 500;
    }

    footer {
      padding: 60px 20px;
      border-top: 1px solid #222;
      font-size: 14px;
      color: #777;
    }
  </style>
</head>
<body>

<header>
  <h1>Digital Archive</h1>
</header>

<main>
  <h2>Your Digital Archive</h2>
  <p>Explore magazines, memories, and curated collections.</p>

  <div class="card">
    <h3>Album 01</h3>
    <p>Coming soon...</p>
  </div>

  <div class="card">
    <h3>Magazine 01</h3>
    <p>Coming soon...</p>
  </div>

</main>

<footer>
  © 2025 Digital Archive
</footer>

</body>
</html>
