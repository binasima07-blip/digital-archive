<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Digital Archive</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at top, #161616 0%, #0d0d0d 60%);
      color: #eaeaea;
      overflow-x: hidden;
      animation: fadeBody 1.2s ease forwards;
    }

    @keyframes fadeBody {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* grain */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: url("https://www.transparenttextures.com/patterns/asfalt-dark.png");
      opacity: 0.05;
      pointer-events: none;
    }

    header {
      padding: 24px 40px;
      border-bottom: 1px solid #1a1a1a;
    }

    header h1 {
      margin: 0;
      font-family: 'Playfair Display', serif;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .hero {
      padding: 140px 20px 100px;
      text-align: center;
      position: relative;
    }

    .hero h2 {
      font-family: 'Playfair Display', serif;
      font-size: 46px;
      margin: 0 0 20px;
      font-weight: 500;
      animation: fadeUp 1s ease forwards;
    }

    .hero p {
      margin: 0;
      font-weight: 300;
      color: #aaa;
      font-size: 18px;
      letter-spacing: 0.4px;
      animation: fadeUp 1.3s ease forwards;
    }

    .hero::after {
      content: "";
      display: block;
      width: 60px;
      height: 1px;
      background: #333;
      margin: 60px auto 0;
      opacity: 0.6;
    }

    .content {
      padding: 80px 40px 120px;
      max-width: 1100px;
      margin: auto;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 40px;
    }

    .card {
      background: rgba(20, 20, 20, 0.8);
      padding: 50px 40px;
      border-radius: 10px;
      border: 1px solid #1f1f1f;
      backdrop-filter: blur(4px);
      text-align: center;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 0.8s ease forwards;
    }

    .card:nth-child(1) { animation-delay: 0.3s; }
    .card:nth-child(2) { animation-delay: 0.5s; }
    .card:nth-child(3) { animation-delay: 0.7s; }

    .card:hover {
      transform: translateY(-6px);
      border-color: #333;
      transition: 0.3s ease;
    }

    .card h3 {
      font-family: 'Playfair Display', serif;
      margin: 0 0 15px;
      font-weight: 500;
      font-size: 22px;
    }

    .card p {
      margin: 0;
      color: #888;
      font-weight: 300;
      font-size: 15px;
    }

    footer {
      padding: 60px 40px;
      border-top: 1px solid #1a1a1a;
      font-size: 14px;
      color: #666;
      text-align: center;
    }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 768px) {
      .hero {
        padding: 110px 20px 80px;
      }

      .hero h2 {
        font-size: 36px;
      }

      .content {
        padding: 60px 20px 100px;
      }
    }

  </style>
</head>
<body>

<header>
  <h1>Digital Archive</h1>
</header>

<section class="hero">
  <h2>Thought Archive</h2>
  <p>Exploring Science, Philosophy & Technology</p>
</section>

<section class="content">
  <div class="grid">

    <div class="card">
      <h3>Essay 01</h3>
      <p>Coming soon...</p>
    </div>

    <div class="card">
      <h3>Essay 02</h3>
      <p>Coming soon...</p>
    </div>

    <div class="card">
      <h3>Essay 03</h3>
      <p>Coming soon...</p>
    </div>

  </div>
</section>

<footer>
  © 2025 Digital Archive
</footer>

</body>
</html>
